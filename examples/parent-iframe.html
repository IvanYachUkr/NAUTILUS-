<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iframe integration example</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; background: #ebe5d8; }
      header { display: flex; gap: 10px; align-items: center; padding: 12px; border-bottom: 1px solid #777; }
      button { padding: 8px 12px; }
      iframe { display: block; width: 100%; height: calc(100vh - 62px); border: 0; }
    </style>
  </head>
  <body>
    <header>
      <strong>Parent repository</strong>
      <button id="select-prague" type="button">Select Prague</button>
      <button id="read-state" type="button">Read child state</button>
      <output id="state"></output>
    </header>

    <iframe
      id="atlas"
      title="Geo Evidence Atlas"
      src="../index.html?syncHash=false"
    ></iframe>

    <script>
      const frame = document.querySelector("#atlas");
      const output = document.querySelector("#state");

      document.querySelector("#select-prague").addEventListener("click", () => {
        frame.contentWindow.postMessage(
          {
            type: "geoatlas:select",
            payload: {
              caseId: "prague-charles-bridge",
              model: "Gemini 3.6 Flash",
              condition: "interactive-panorama"
            }
          },
          window.location.origin
        );
      });

      document.querySelector("#read-state").addEventListener("click", () => {
        frame.contentWindow.postMessage(
          { type: "geoatlas:get-state", requestId: crypto.randomUUID() },
          window.location.origin
        );
      });

      window.addEventListener("message", (event) => {
        if (event.origin !== window.location.origin) return;
        if (event.data?.type === "geoatlas:state") {
          output.textContent = JSON.stringify(event.data.payload);
        }
      });
    </script>
  </body>
</html>
