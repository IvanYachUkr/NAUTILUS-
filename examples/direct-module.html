<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Direct module integration</title>
    <link rel="stylesheet" href="../src/styles.css" />
  </head>
  <body>
    <div id="custom-atlas"></div>

    <script type="module">
      import { createExplorer, loadCasesFromUrl } from "../src/api.js";

      const cases = await loadCasesFromUrl("./minimal-results.json");
      const explorer = createExplorer({
        root: "#custom-atlas",
        cases,
        syncHash: false,
      });

      window.customExplorer = explorer;
    </script>
  </body>
</html>
