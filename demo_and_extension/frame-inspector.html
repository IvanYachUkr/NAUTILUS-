<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recorded frame inspector</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #07111f; color: #e6edf7; }
    main { width: min(1400px, calc(100vw - 40px)); margin: 28px auto 56px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:18px; }
    .eyebrow { color:#67e8f9; font-size:12px; text-transform:uppercase; letter-spacing:.12em; font-weight:700; }
    h1 { margin:6px 0 0; font-size:24px; }
    p { color:#9fb0c8; }
    .card { border:1px solid #20334d; border-radius:16px; background:#0b1727; overflow:hidden; box-shadow:0 18px 60px rgba(0,0,0,.3); }
    .stage { min-height:420px; display:grid; place-items:center; background:#020817; position:relative; }
    .stage img { width:100%; height:auto; display:block; }
    .status { padding:28px; text-align:center; color:#9fb0c8; }
    .meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1px; background:#20334d; border-top:1px solid #20334d; }
    .meta div { padding:14px 16px; background:#0b1727; }
    .meta small { display:block; color:#71839d; margin-bottom:4px; }
    .meta strong { font-size:14px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
    a, button { appearance:none; border:1px solid #2a4568; border-radius:10px; background:#10243b; color:#dce8f7; padding:10px 14px; text-decoration:none; font:inherit; cursor:pointer; }
    a:hover,button:hover { border-color:#38bdf8; }
    video { width:min(560px,100%); margin-top:18px; border-radius:12px; border:1px solid #20334d; background:#000; }
    .error { color:#fda4af; }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow">Interactive panorama evidence</div><h1 id="title">Recorded frame inspector</h1></div>
      <a href="/">Back to atlas</a>
    </header>
    <section class="card">
      <div class="stage" id="stage"><div class="status" id="status">Loading recorded video and searching nearby frames…</div></div>
      <div class="meta">
        <div><small>Requested time</small><strong id="requested">—</strong></div>
        <div><small>Selected time</small><strong id="selected">—</strong></div>
        <div><small>Offset</small><strong id="offset">—</strong></div>
        <div><small>Sharpness score</small><strong id="sharpness">—</strong></div>
      </div>
    </section>
    <div class="actions">
      <a id="open-png" href="#" target="_blank" rel="noopener noreferrer" hidden>Open selected PNG ↗</a>
      <button id="toggle-context" type="button">Show video context</button>
    </div>
    <video id="context-video" controls muted hidden></video>
  </main>
  <script type="module" src="/src/frame-inspector.js"></script>
</body>
</html>
